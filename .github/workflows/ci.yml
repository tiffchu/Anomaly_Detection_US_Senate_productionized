name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lint dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Run Ruff
        run: ruff check --output-format=github .

      - name: Run Python tests
        run: python -m pytest -q

  dbt:
    name: dbt build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dbt dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Create fixture database
        run: python tests/create_ci_database.py --database "${{ runner.temp }}/ci.duckdb"

      - name: Build and test dbt models
        env:
          DBT_DUCKDB_PATH: ${{ runner.temp }}/ci.duckdb
        run: dbt build --project-dir dbt_project --profiles-dir dbt_project
