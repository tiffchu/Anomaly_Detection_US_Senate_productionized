senate_trades:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: ../congress.duckdb
      threads: 4
    bigquery:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BIGQUERY_DATASET', 'senate_trades') }}"
      threads: 4
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
