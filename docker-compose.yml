services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: sqlite:////usr/local/airflow/include/data/mlflow.db
      MLFLOW_REGISTRY_URI: sqlite:////usr/local/airflow/include/data/mlflow.db
      MLFLOW_MODEL_NAME: congress-trade-anomaly-detector
      MLFLOW_MODEL_ALIAS: production
    volumes:
      - ./include/data:/usr/local/airflow/include/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////usr/local/airflow/include/data/mlflow.db --default-artifact-root /usr/local/airflow/include/data/mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - ./include/data:/usr/local/airflow/include/data

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    env_file: .env
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./ingestion:/opt/airflow/project/ingestion
      - ./storage:/opt/airflow/project/storage
      - ./ml:/opt/airflow/project/ml
      - ./api:/opt/airflow/project/api
      - ./config.py:/opt/airflow/project/config.py
