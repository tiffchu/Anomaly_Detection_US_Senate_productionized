services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    env_file: .env
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./ingestion:/opt/airflow/project/ingestion
      - ./storage:/opt/airflow/project/storage
      - ./ml:/opt/airflow/project/ml
      - ./api:/opt/airflow/project/api
      - ./config.py:/opt/airflow/project/config.py
