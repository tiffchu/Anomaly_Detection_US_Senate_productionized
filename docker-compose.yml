services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=mlflow:5000,localhost,127.0.0.1
      - --backend-store-uri=sqlite:////usr/local/airflow/include/data/mlflow.db
      - --default-artifact-root=/usr/local/airflow/include/data/mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - ./include/data:/usr/local/airflow/include/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_REGISTRY_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: congress-trade-anomaly-detector
      MLFLOW_MODEL_ALIAS: production
    volumes:
      - ./include/data:/usr/local/airflow/include/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
